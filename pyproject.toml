[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "havoc-userbot"
version = "2.0.0"
description = "HAVOC — a bilingual (English/Farsi) modular Telegram userbot built on Telethon"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HAVOC" }]
keywords = ["telegram", "userbot", "telethon", "persian", "farsi", "automation"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Natural Language :: Persian",
]
dependencies = [
    "telethon>=1.34,<2",
]

[project.optional-dependencies]
# Card rendering for `.fal`: Pillow draws, arabic-reshaper + python-bidi join
# and reorder Persian. Without this extra `.fal` still works in text mode.
media = [
    "pillow>=10",
    "arabic-reshaper>=3",
    "python-bidi>=0.4",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pyyaml>=6",
]

[project.scripts]
havoc = "havoc.main:cli"

[tool.setuptools]
packages = [
    "havoc",
    "havoc.features",
    "havoc.services",
    "havoc.utils",
]

[tool.setuptools.package-data]
havoc = ["locales/*.json", "data/*.gz", "assets/fonts/*.ttf"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:telethon.*",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
