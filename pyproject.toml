[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "havoc-userbot"
version = "2.0.0"
description = "HAVOC — a bilingual (English/Farsi) modular Telegram userbot built on Telethon"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HAVOC" }]
keywords = ["telegram", "userbot", "telethon", "persian", "farsi", "automation"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Natural Language :: Persian",
]
dependencies = [
    "telethon>=1.34,<2",
]

[project.optional-dependencies]
# Card rendering for `.fal`: Pillow draws, arabic-reshaper + python-bidi join
# and reorder Persian. Without this extra `.fal` still works in text mode.
media = [
    "pillow>=10",
    "arabic-reshaper>=3",
    "python-bidi>=0.4",
]
# Her voice, with no account and no key. `.yura speak` is silent without this
# extra, and says so rather than half-working.
voice = [
    "edge-tts>=6.1",
]
# The downloader: a YouTube/TikTok/Instagram link in Saved Messages becomes the
# video itself. `yt-dlp` grows a new site extractor every week, so it is pinned
# only at the floor — a ceiling here would mean a site that stops working the day
# it adds a new page shape. ffmpeg is not a Python package; `docs/INSTALL.md`
# names it, and the command says plainly when merging is unavailable.
download = [
    "yt-dlp>=2024.8.6",
    "gallery-dl>=1.32",
]
# The TikTok side: a real Chromium wearing the owner's cookies, not the TikTok
# API (which cannot like, follow, block or open an inbox). Optional for the same
# reason as `download` — a clone without it boots and says what to install.
# `python -m playwright install --with-deps chromium` fetches the browser itself.
browser = [
    "playwright>=1.45",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pyyaml>=6",
]

[project.scripts]
havoc = "havoc.main:cli"
yura = "havoc.main:cli"

[tool.setuptools]
packages = [
    "havoc",
    "havoc.features",
    "havoc.services",
    "havoc.utils",
    "havoc.tiktok",
]

[tool.setuptools.package-data]
havoc = ["locales/*.json", "data/*.gz", "assets/fonts/*.ttf"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:telethon.*",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
