name: Local model

# A model that lives on the runner, not behind an API key.
#
# Why it exists: every other way Yura thinks needs a key, a quota and a network.
# When the allowance is spent she goes quiet until midnight, and a clone with no
# keys at all never answers. A GGUF on disk removes all three — the router asks
# it *after* every key has refused (see `AIRouter._ask_local`), and with no keys
# at all it is the engine rather than the spare.
#
# Why its own workflow: downloading a model, starting a server and asking it
# three questions takes minutes and would delay every deploy if it lived inside
# `auth-and-run.yml`. It also has nothing to do with logging in.
#
# How it stays on a six-hour rhythm: schedules only fire for workflows on the
# *default* branch, and this branch is not it. So the running bot's workflow —
# which is awake anyway — asks `scripts/local_model_schedule.py` once per run
# whether the last check in `.local-model.json` is more than `--every-hours` old,
# and dispatches this one if it is. The report this workflow commits is the
# clock, so a cancelled run simply means the next one is due.
#
# What it proves, in order:
#   1. a llama.cpp server starts from a real binary and a real .gguf;
#   2. `LocalModel.start()` notices it inside its own timeout;
#   3. it answers three questions through the same `converse()` the chat uses;
#   4. `AIRouter` with **zero credentials** still gets an answer, labelled local.
#
# The weights and the binary are cached between runs (a 400 MB download sixty
# times a day would be rude and slow), and the server is killed at the end even
# when a step failed — a runner that keeps a model resident is a runner that
# times out.

on:
  # The real clock for anyone whose default branch is this one.
  schedule:
    - cron: "0 */6 * * *"
  push:
    paths:
      - ".github/workflows/local-model.yml"
      - "scripts/local_model_check.py"
      - "scripts/local_model_schedule.py"
      - "havoc/services/local_model.py"
      - "havoc/services/ai_router.py"
  workflow_dispatch:
    inputs:
      model_url:
        description: "GGUF to fetch (default: Qwen2.5-0.5B-Instruct Q4_K_M)"
        required: false
        type: string
      llama_tag:
        description: "llama.cpp release tag (default: b12032, a known-good build)"
        required: false
        default: "b12032"
      skip_download:
        description: "Only check a local endpoint (LOCAL_MODEL_URL), fetch nothing"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: havoc-local-model
  cancel-in-progress: false

env:
  # Where the binary and the weights live between runs. Everything else about
  # the model arrives as a dispatch input and is resolved inside each step, so a
  # missing input can never expand to an empty string somewhere quiet.
  KIT_DIR: ${{ github.workspace }}/.runtime/local-model

jobs:
  model:
    name: serve and ask
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Restore the binary and the weights
        id: kit
        uses: actions/cache@v4
        with:
          path: .runtime/local-model
          # Keyed by both knobs: changing the model must not silently reuse the
          # old weights, and changing the build must not reuse the old server.
          key: local-model-${{ inputs.llama_tag || 'b12032' }}-${{ hashFiles('.github/workflows/local-model.yml') }}-${{ inputs.model_url || 'default' }}
          restore-keys: |
            local-model-${{ inputs.llama_tag || 'b12032' }}-

      - name: Report what was restored
        shell: bash
        env:
          IN_TAG: ${{ inputs.llama_tag }}
          IN_MODEL: ${{ inputs.model_url }}
        run: |
          set -uo pipefail
          LLAMA_TAG="${IN_TAG:-b12032}"
          MODEL_URL="${IN_MODEL:-https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf}"
          echo "cache hit: ${{ steps.kit.outputs.cache-hit }}"
          find .runtime/local-model -maxdepth 3 -name "llama-server" -o -maxdepth 3 -name "*.gguf" 2>/dev/null | sed 's/^/  /' || true
          {
            echo "### Local model kit"
            echo ""
            echo "cache: \\`${{ steps.kit.outputs.cache-hit || 'miss' }}\\`"
            echo "llama.cpp: \\`${LLAMA_TAG}\\`"
            echo "weights: \\`${MODEL_URL##*/}\\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch llama.cpp
        # A failed download is not a failed job: the check step reports exactly
        # what is missing, in words, and that report is committed.
        #
        # The extracted directory is kept as it came out of the tarball and the
        # server is run *from there*, with its own directory on LD_LIBRARY_PATH.
        # Flattening the archive into one folder was the first version, and it
        # failed on a runner with "libllama-server-impl.so: cannot open shared
        # object file" — the library exists, the flattened copy did not.
        continue-on-error: true
        if: inputs.skip_download != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_TAG: ${{ inputs.llama_tag }}
        run: |
          set -uo pipefail
          LLAMA_TAG="${IN_TAG:-b12032}"
          mkdir -p "$KIT_DIR"
          note="$KIT_DIR/fetch.txt"
          touch "$note"
          marker="$KIT_DIR/server.path"
          # The one honest test: does it run?
          works() {
            local candidate="$1"
            [ -x "$candidate" ] || return 1
            LD_LIBRARY_PATH="$(dirname "$candidate")" "$candidate" --version >/dev/null 2>&1
          }
          if [ -f "$marker" ]; then
            cached=$(cat "$marker")
            if works "$cached"; then
              echo "server · cached and runs ($cached)" >> "$note"
              echo "using cached $cached"; exit 0
            fi
            echo "server · cached copy does not run, fetching again" >> "$note"
            rm -f "$marker"
          fi
          found=$(find "$KIT_DIR" -name llama-server -type f 2>/dev/null | head -1 || true)
          if [ -n "$found" ] && works "$found"; then
            echo "$found" > "$marker"
            echo "server · already unpacked and runs ($found)" >> "$note"
            exit 0
          fi

          # The asset name changes with every build, so ask the API which
          # ubuntu-x64 tarball the requested tag (or the newest five) has. A
          # hard-coded URL is a workflow that rots the week the tag rolls.
          urls=()
          for tag in "$LLAMA_TAG" ""; do
            if [ -n "$tag" ]; then
              api="https://api.github.com/repos/ggml-org/llama.cpp/releases/tags/$tag"
            else
              api="https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=5"
            fi
            picked=$(curl -fsS --max-time 60 -H "Authorization: Bearer ${GH_TOKEN}" "$api" \
              | grep -o 'https://[^"]*bin-ubuntu-x64\.tar\.gz' | head -1) || true
            if [ -n "${picked:-}" ]; then urls+=("$picked"); fi
            [ "${#urls[@]}" -gt 0 ] && break
          done
          if [ "${#urls[@]}" -eq 0 ]; then
            echo "server · no ubuntu-x64 build found" >> "$note"
            echo "::warning::no llama.cpp build found for $LLAMA_TAG"
            exit 0
          fi
          url="${urls[0]}"
          echo "server · $url" >> "$note"
          echo "::notice::fetching $url"
          dir="$KIT_DIR/build-$(date +%s)"
          mkdir -p "$dir"
          if ! curl -fsSL --retry 2 --max-time 900 -o "$dir/llama.tar.gz" "$url"; then
            echo "server · download failed" >> "$note"
            echo "::warning::could not download $url"
            exit 0
          fi
          if ! tar xzf "$dir/llama.tar.gz" -C "$dir"; then
            echo "server · unpack failed" >> "$note"
            exit 0
          fi
          rm -f "$dir/llama.tar.gz"
          bin=$(find "$dir" -name llama-server -type f | head -1 || true)
          if [ -z "$bin" ]; then
            echo "server · no llama-server in the archive" >> "$note"
            exit 0
          fi
          chmod +x "$bin" 2>/dev/null || true
          if works "$bin"; then
            echo "$bin" > "$marker"
            echo "server · unpacked and runs ($bin)" >> "$note"
            LD_LIBRARY_PATH="$(dirname "$bin")" "$bin" --version 2>&1 | head -2 | sed 's/^/  /' || true
          else
            echo "server · unpacked but does not run here" >> "$note"
            LD_LIBRARY_PATH="$(dirname "$bin")" "$bin" --version 2>&1 | head -5 | sed 's/^/  /' || true
          fi

      - name: Fetch the weights
        continue-on-error: true
        if: inputs.skip_download != 'true'
        shell: bash
        env:
          IN_MODEL: ${{ inputs.model_url }}
        run: |
          set -uo pipefail
          mkdir -p "$KIT_DIR"
          note="$KIT_DIR/fetch.txt"
          touch "$note"
          if ls "$KIT_DIR"/*.gguf >/dev/null 2>&1; then
            echo "weights · cached ($(ls -1 "$KIT_DIR"/*.gguf | head -1))" >> "$note"
            echo "already have a .gguf"; exit 0
          fi
          # First candidate wins. The extra entries are the same model published
          # under a slightly different quant name, plus one tiny model so the
          # path can still be proven on a day Hugging Face is unhappy.
          candidates=(
            "${IN_MODEL:-https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf}"
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_0.gguf"
            "https://huggingface.co/ggml-org/Qwen2.5-0.5B-Instruct-Q8_0-GGUF/resolve/main/qwen2.5-0.5b-instruct-q8_0.gguf"
            "https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf"
          )
          for url in "${candidates[@]}"; do
            name=$(basename "${url%%\?*}")
            echo "::notice::trying ${name}"
            if curl -fL --retry 1 --max-time 1800 -o "$KIT_DIR/$name.part" "$url"; then
              mv "$KIT_DIR/$name.part" "$KIT_DIR/$name"
              echo "weights · $name from $url" >> "$note"
              ls -lh "$KIT_DIR/$name"
              exit 0
            fi
            rm -f "$KIT_DIR/$name.part"
            echo "weights · $name failed" >> "$note"
          done
          echo "::warning::no weights could be downloaded"

      - name: Serve it and ask it things
        id: ask
        shell: bash
        env:
          IN_MODEL: ${{ inputs.model_url }}
        run: |
          set -uo pipefail
          mkdir -p "$KIT_DIR"
          # Run the server from inside its own build directory: that is where its
          # libraries are.
          bin=""
          if [ -f "$KIT_DIR/server.path" ]; then bin=$(cat "$KIT_DIR/server.path"); fi
          if [ -z "$bin" ] || [ ! -x "$bin" ]; then bin=$(find "$KIT_DIR" -name llama-server -type f 2>/dev/null | head -1 || true); fi
          if [ -n "$bin" ]; then
            LD_LIBRARY_PATH="$(dirname "$bin")"; export LD_LIBRARY_PATH
          fi
          gguf=$(ls "$KIT_DIR"/*.gguf 2>/dev/null | head -1 || true)
          json_out="$KIT_DIR/local-model.json"
          log="$KIT_DIR/check.log"
          args=(--json "$json_out" --timeout 180)
          if [ "${{ inputs.skip_download }}" = "true" ] || [ -z "${bin:-}" ] || [ ! -x "${bin:-/nonexistent}" ] || [ -z "$gguf" ]; then
            # Nothing to launch: check the endpoint the owner configured instead,
            # and say so rather than pretending the runner made a model.
            echo "::notice::no binary or no weights on this runner; checking LOCAL_MODEL_URL only"
            args+=(--url "${LOCAL_MODEL_URL:-http://127.0.0.1:8080/v1}" --binary /nonexistent --model "")
          else
            args+=(--binary "$bin" --model "$gguf" --url http://127.0.0.1:8080/v1 --name "${gguf##*/}")
          fi
          set +e
          LD_LIBRARY_PATH="$KIT_DIR" python scripts/local_model_check.py "${args[@]}" 2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          set -e

          # Fold the checker's report *and* the fetch notes into the file that
          # gets committed: a run log is not always reachable, and "no report was
          # written" tells the owner nothing.
          python - "$code" <<'PY'
          import datetime, json, pathlib, sys
          kit = pathlib.Path(".runtime/local-model")
          data = {"at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")}
          try:
              data.update(json.loads((kit / "local-model.json").read_text()))
          except (OSError, ValueError):
              data["checks"] = []
          checks = data.get("checks") or []
          fetch = (kit / "fetch.txt").read_text().strip().splitlines() if (kit / "fetch.txt").exists() else []
          tail = (kit / "check.log").read_text()[-1500:] if (kit / "check.log").exists() else ""
          if not checks:
              checks = [{"name": "the checker wrote nothing", "ok": False, "detail": tail or "no output"}]
          data["checks"] = checks
          data["fetch"] = fetch
          data["exit"] = int(sys.argv[1])
          data["log_tail"] = tail
          pathlib.Path(".local-model.json").write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          ok = sum(1 for c in checks if c.get("ok"))
          print(f"::notice::local model: {ok}/{len(checks)} checks passed")
          PY
          {
            echo "### Local model"
            echo ""
            echo "\`\`\`"
            sed -n '1,60p' "$log" || true
            echo "\`\`\`"
            if [ -s "$KIT_DIR/fetch.txt" ]; then
              echo ""
              echo "**What was fetched**"
              echo ""
              echo '```'
              cat "$KIT_DIR/fetch.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Red when the model could not answer: a green tick over a model that
          # never started is the kind of quiet lie this workflow exists to catch.
          exit "$code"

      - name: Stop the server
        # Without this the runner keeps the model resident and the job sits until
        # its timeout: a killed job leaves the workflow looking broken.
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          pkill -f llama-server 2>/dev/null && echo "stopped llama-server" || echo "no server was running"
          sleep 1
          pgrep -af llama-server || echo "nothing left behind"

      - name: Publish the report
        # Committed so the answer to "is the local model working" is readable
        # without the run log, which is not always reachable.
        continue-on-error: true
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          [ -f .local-model.json ] || { echo "no report to publish"; exit 0; }
          git config user.name "HAVOC local model"
          git config user.email "local-model@users.noreply.github.com"
          git add .local-model.json
          if git diff --cached --quiet; then
            echo "the report did not change"; exit 0
          fi
          git commit -qm "local model $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for _ in 1 2 3; do
            git fetch -q origin "${GITHUB_REF_NAME}" || true
            git rebase -q --autostash FETCH_HEAD 2>/dev/null || { git rebase --abort 2>/dev/null || true; sleep 2; continue; }
            if git push -q origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 2
          done
          echo "::warning::could not publish .local-model.json"
