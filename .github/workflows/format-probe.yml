name: Format probe

# The claims a unit test cannot make, asked of the real model and recorded.
#
# Why this exists: "her formatting works", "she can see pictures" and "she knows
# who she is answering" are three things that fail *silently* — she falls back to
# an offline line, or answers the wrong person politely, and nothing in the chat
# says why. This job spends three model requests, prints the model's raw text and
# the Telegram HTML it becomes, and records both in `.format-probe.json` so the
# answer can be read in the repository instead of taken on trust.
#
# No Telegram and no login: the keys live in `.auth/`, so run this and read it.

on:
  push:
    paths:
      - "havoc/**"
      - "scripts/format_probe.py"
      - ".github/workflows/format-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: havoc-format-probe
  cancel-in-progress: true

jobs:
  probe:
    name: ask the model to format, look and listen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . edge-tts

      - name: Ask the real model
        shell: bash
        continue-on-error: true
        env:
          DATA_DIR: ${{ github.workspace }}/.runtime/data
          LOG_DIR: ${{ github.workspace }}/.runtime/logs
        run: |
          set -uo pipefail
          python scripts/format_probe.py 2>&1 | tee .format-probe.txt
          {
            echo "### Format probe"
            echo ""
            echo '```'
            tail -n 40 .format-probe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the record where it can be read
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          rm -f .format-probe.txt
          if [ ! -f .format-probe.json ]; then
            echo "::warning::The probe wrote no record; nothing to publish."
            exit 0
          fi
          git config user.name "HAVOC format probe"
          git config user.email "probe@users.noreply.github.com"
          git add .format-probe.json
          if git diff --cached --quiet; then
            echo "nothing new to publish"
            exit 0
          fi
          git commit -qm "ci: format probe result [skip ci]"
          # The running bot commits snapshots every few minutes, so the branch
          # may move while this job runs. Rebase and retry.
          for attempt in 1 2 3; do
            if git pull -q --rebase origin "${GITHUB_REF_NAME}" && \
               git push -q origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
              echo "published on attempt ${attempt}"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::warning::Could not publish the probe result; the artifact still has it."

      - name: Keep the record as an artifact too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: format-probe
          path: .format-probe.json
          if-no-files-found: warn
