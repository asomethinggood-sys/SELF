name: Experimental cluster authentication preflight

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cluster-auth-test.yml
      - scripts/check_cluster_auth.py
      - scripts/sdxl_oidc.py

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q cryptography
      - name: Verify scoped GitHub Actions OIDC identity
        run: python scripts/check_cluster_auth.py
