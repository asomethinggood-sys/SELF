name: Service · model

# Ollama on CPU with one small model: the spare tyre the router asks after
# every key has refused, and the engine when there are no keys at all.
#
# One service, one runner, its own six hours. It publishes
# `.services/ollama.json` when it comes up — the address changes on every
# restart, so the bot reads it instead of being configured with it (see
# `havoc/services/service_directory.py`).
#
# In front of it: `scripts/service_gate.py`, a bearer-token gate with `/healthz`,
# a per-minute cap and an 8 MB body cap. The token is derived per run from
# `SERVICE_SHARED_SECRET` (`havoc/services/service_token.py`) and dies with the
# run. Nothing has to be configured: with no secret the gate falls back to the
# committed default, and `SERVICE_PUBLIC=1` (repository variable) drops the token
# entirely — the owner's choice, since the services are free anyway.
#
# Staying alive: same pattern as the bot. A successor is queued in the first
# step, `scripts/handover.py` is asked once a minute whether it is still there,
# and the concurrency group queues rather than cancels. `handover` is scoped by
# workflow file, so four long-lived workflows on one branch do not starve each
# other.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/service-ollama.yml"
      - "scripts/service_host.py"
      - "scripts/service_gate.py"
      - "scripts/fetch_artifact.py"
      - "havoc/services/service_token.py"
      - ".services/assets.json"

permissions:
  contents: write
  actions: write

concurrency:
  group: havoc-ollama
  cancel-in-progress: false

jobs:
  serve:
    name: ollama
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Queue the successor
        # First, before anything can fail: whatever ends this run, the next one
        # is already waiting.
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HANDOVER_WORKFLOW: service-ollama.yml
        run: |
          set -uo pipefail
          python scripts/handover.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        shell: bash
        run: |
          set -uo pipefail
          python -m pip install -q -e ".[dev]"
          python -c "import havoc.services.service_token; print('token module ok')"

      - name: Which mode is this?
        # No secret to add: without `SERVICE_SHARED_SECRET` the gate uses the
        # committed default, which keeps drive-by scanners out but is no defence
        # against anyone who reads this repository — the owner's explicit choice.
        # `SERVICE_PUBLIC=1` (repository variable) drops the token entirely.
        id: token
        shell: bash
        env:
          SHARED: ${{ secrets.SERVICE_SHARED_SECRET }}
          PUBLIC: ${{ vars.SERVICE_PUBLIC }}
        run: |
          set -uo pipefail
          if [ "${PUBLIC:-}" = "1" ]; then
            mode="public — no token at all (SERVICE_PUBLIC=1)"
          elif [ -n "${SHARED:-}" ]; then
            mode="gated — the token comes from SERVICE_SHARED_SECRET"
            echo "SERVICE_SECRET=$SHARED" >> "$GITHUB_ENV"
          else
            mode="gated with the committed default secret (no setup needed)"
            echo "::notice::No SERVICE_SHARED_SECRET: using the committed default. The token keeps scanners out, not people who read the repository. Set the secret to change that, or SERVICE_PUBLIC=1 for a fully open service."
          fi
          echo "mode=$mode"
          {
            echo "### Gate mode"
            echo ""
            echo "$mode"
          } >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from havoc.services.service_token import secret_for, token_for
          print("token derivation ok, sample:", token_for("ollama", "1", "2026-01-01T00:00:00Z", secret_for() or "x")[:16] + "…")
          PY

      - name: Restore the model weights
        id: models
        uses: actions/cache@v4
        with:
          # A 0.5B is 400 MB, a 3B is 2 GB. The pull is the slowest part of a
          # restart after the image install.
          path: |
            .runtime/service-ollama/ollama-models
          key: ollama-${{ vars.OLLAMA_MODEL || 'qwen2.5:0.5b' }}-${{ github.run_id }}
          restore-keys: |
            ollama-${{ vars.OLLAMA_MODEL || 'qwen2.5:0.5b' }}-
            ollama-

      - name: Report the cache
        shell: bash
        run: |
          echo "cache hit: ${{ steps.models.outputs.cache-hit }}"
          du -sh .runtime/service-ollama/ollama-models 2>/dev/null || echo "nothing restored"


      - name: Pre-flight
        # What is installed before we try to run anything, so a failure at minute
        # four has a cause printed at minute zero.
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "### Service · model"
            echo ""
            echo "- runner: $(uname -sr) · $(nproc) cores · $(free -g | awk '/^Mem:/{print $2}') GB"
            echo "- disk: $(df -h / | awk 'NR==2{print $4}') free"
            echo "- model: ${{ vars.OLLAMA_MODEL || 'qwen2.5:0.5b' }}"
            echo "- weights cache: ${{ steps.models.outputs.cache-hit || 'miss' }}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Serve
        id: serve
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SERVICE_SECRET is set by the "Which mode is this?" step above, through
          # $GITHUB_ENV: a step-level entry here would shadow it with the empty
          # repository value.
          SERVICE_MINUTES: "335"
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen2.5:0.5b' }}
          COMFY_CKPT: ${{ vars.COMFY_CKPT || 'sd-turbo.safetensors' }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          CLOUDFLARE_HOSTNAME: ${{ vars.CLOUDFLARE_HOSTNAME }}
          SERVICE_PUBLIC: ${{ vars.SERVICE_PUBLIC }}
        run: |
          set -uo pipefail
          echo "service=ollama minutes=$SERVICE_MINUTES mode=${{ steps.token.outputs.mode }}"
          # The host proves the service on loopback (a real completion) and only
          # then opens the tunnel.
          python -u scripts/service_host.py --service ollama
          echo "host exited with $?"

      - name: Stop everything
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          for pattern in service_gate.py service_host.py cloudflared "ollama serve"; do
            if pgrep -f "$pattern" >/dev/null 2>&1; then
              pkill -f "$pattern" && echo "killed: $pattern"
            fi
          done
          docker rm -f havoc-searxng >/dev/null 2>&1 && echo "killed: searxng container" || true
          echo "--- what is left ---"
          pgrep -af "service_gate|service_host|cloudflared|ollama" || echo "nothing"

      - name: Report
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "### Service · model · finished"
            echo ""
            if [ -f .services/ollama.json ]; then
              echo '```json'
              cat .services/ollama.json
              echo '```'
            else
              echo "_no address was published — the service never came up_"
            fi
            echo ""
            echo "gate log tail:"
            echo '```'
            tail -n 20 .runtime/service-ollama/logs/gate.log 2>/dev/null || echo "(none)"
            echo '```'
            echo "service log tail:"
            echo '```'
            tail -n 25 .runtime/service-ollama/logs/ollama.log 2>/dev/null || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
