name: Key probe

# Every AI credential, tried once, with the answer committed.
#
# Why: there are now two providers and four keys, and "the bot is quiet" could
# mean any of them. This job asks each key a question it cannot bluff, records
# the status and the first bytes of the body in `.ai-keys-probe.json`, and says
# which auth style the Gemini keys accept. It spends one request per provider per
# key, which is why it runs on key changes and on demand — not on every push.

on:
  push:
    paths:
      - ".auth/ai-keys.json"
      - "scripts/probe_keys.py"
      - ".github/workflows/key-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: havoc-key-probe
  cancel-in-progress: true

jobs:
  probe:
    name: try every key
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe
        shell: bash
        run: |
          set -uo pipefail
          # Mask every decoded key before anything can print it.
          python - <<'PYEOF'
          import base64, json, pathlib
          raw = json.loads(pathlib.Path(".auth/ai-keys.json").read_text(encoding="utf-8"))
          for item in raw.get("keys", []):
              key = base64.b64decode(item["key_b64"]).decode().strip()
              print(f"::add-mask::{key}")
          PYEOF
          python scripts/probe_keys.py > .ai-keys-probe.json 2> .ai-keys-probe.log || true
          cat .ai-keys-probe.log
          cat .ai-keys-probe.json
          {
            echo "### Key probe"
            echo ""
            echo '```json'
            head -c 4000 .ai-keys-probe.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the answer
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          rm -f .ai-keys-probe.log
          git config user.name "HAVOC key probe"
          git config user.email "probe@users.noreply.github.com"
          git add .ai-keys-probe.json
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -qm "ci: key probe result [skip ci]"
          for attempt in 1 2 3; do
            if git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
              echo "published on attempt ${attempt}"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::warning::Could not publish the probe result."
