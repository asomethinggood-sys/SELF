name: Credential probe

# Answers one question with evidence instead of folklore: can the credentials
# published inside Telegram's own clients still log a userbot in?
#
# It makes two unauthenticated requests per pair — help.getConfig, and
# auth.sendCode to a number that cannot exist — so no code is ever sent to
# anybody, and your own phone number is never involved.
#
# Run it from the Actions tab, or let the push trigger below do it once. The
# verdicts are published three ways so they can be read without downloading
# logs: an annotation, the job summary, and a committed JSON file.

on:
  push:
    paths:
      - ".github/workflows/credential-probe.yml"
      - "scripts/probe_credentials.py"
  workflow_dispatch:
    inputs:
      api_id:
        description: "Optional: probe a specific api_id instead of the published ones"
        required: false
        type: string
      api_hash:
        description: "Optional: the matching api_hash"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: credential-probe
  cancel-in-progress: true

jobs:
  probe:
    name: probe credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e .

      - name: Probe
        id: probe
        env:
          INPUT_API_ID: ${{ inputs.api_id }}
          INPUT_API_HASH: ${{ inputs.api_hash }}
        run: |
          set -uo pipefail
          args=(--json-out probe-results.json --markdown-out probe-report.md --timeout 25)
          if [ -n "${INPUT_API_ID:-}" ] && [ -n "${INPUT_API_HASH:-}" ]; then
            args+=(--api-id "$INPUT_API_ID" --api-hash "$INPUT_API_HASH" --label custom)
          fi
          set +e
          python scripts/probe_credentials.py "${args[@]}"
          status=$?
          set -e
          cat probe-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

          # One annotation per verdict: annotations are readable through the API
          # even when the log archive is not reachable.
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("probe-results.json").read_text())
          for row in data:
              level = "notice" if row["verdict"] == "works" else "warning"
              print(f"::{level}::{row['label']} api_id={row['api_id']} -> {row['verdict']}")
          usable = [r["label"] for r in data if r["verdict"] == "works"]
          pathlib.Path("probe-usable.txt").write_text(",".join(usable))
          PY

          usable=$(cat probe-usable.txt)
          echo "usable=$usable" >> "$GITHUB_OUTPUT"
          if [ -n "$usable" ]; then
            echo "RESULT: usable -> $usable"
          elif [ "$status" -eq 2 ]; then
            echo "::warning::Telegram was unreachable from the runner for every pair."
            echo "RESULT: network"
          else
            echo "RESULT: none-usable"
          fi
          # Never fail the job: the answer is the data, not the exit code.
          exit 0

      - name: Record the verdict in the repository
        run: |
          set -euo pipefail
          git config user.name "HAVOC probe"
          git config user.email "probe@users.noreply.github.com"
          git add probe-results.json probe-report.md
          if git diff --cached --quiet; then
            echo "no change in the verdicts"
            exit 0
          fi
          git commit -m "Credential probe: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: probe-report-${{ github.run_id }}
          path: |
            probe-results.json
            probe-report.md
          retention-days: 7
