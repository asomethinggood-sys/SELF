name: AI probe

# One real request to the model, no Telegram, no login code, no waiting.
#
# Why this exists: a key and a model slug can both look right in a config file
# and still not answer, and Yura falls back to her offline bank so quietly that
# a dead provider can go unnoticed for days. This job asks the gateway a
# question it cannot bluff its way through (2+2), prints the reply, and fails
# when there is no reply — so a green tick here means the model really answered,
# and a red one names the failure kind.
#
# The answer is also committed to `.ai-probe.json`: the run log is served from a
# host that is not reachable from every environment this repository is read in,
# and a file in the repository can always be read.
#
# The key comes from `.auth/config.json` (`ai.api_key_b64`, decoded into
# AI_API_KEY below) or from the OPENROUTER_API_KEY repository secret, whichever
# is present. It is masked before the first line of output.

on:
  push:
    paths:
      - "havoc/**"
      - ".auth/config.json"
      - ".github/workflows/ai-probe.yml"
  workflow_dispatch:
  schedule:
    # Once a day, after the free tier's UTC reset: if yesterday's runs spent the
    # 50-request allowance, this is the run that proves the key still answers.
    - cron: "17 1 * * *"

permissions:
  contents: write

concurrency:
  group: havoc-ai-probe
  cancel-in-progress: true

jobs:
  probe:
    name: ask the model 2+2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Read the AI configuration
        id: ai
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -uo pipefail
          ai_provider=$(python -c 'import json;print((json.load(open(".auth/config.json")).get("ai") or {}).get("provider",""))' 2>/dev/null || true)
          ai_base_url=$(python -c 'import json;print((json.load(open(".auth/config.json")).get("ai") or {}).get("base_url",""))' 2>/dev/null || true)
          ai_model=$(python -c 'import json;print((json.load(open(".auth/config.json")).get("ai") or {}).get("model",""))' 2>/dev/null || true)
          ai_api_key="${OPENROUTER_API_KEY:-$(python -c 'import base64,json;b=(json.load(open(".auth/config.json")).get("ai") or {});k=(b.get("api_key") or "").strip();k=k or (base64.b64decode(b["api_key_b64"]).decode().strip() if b.get("api_key_b64") else "");print(k)' 2>/dev/null || true)}"
          if [ -n "$ai_api_key" ]; then
            echo "::add-mask::$ai_api_key"
          else
            echo "::error::No AI key in .auth/config.json (ai.api_key_b64) and no OPENROUTER_API_KEY secret."
            exit 1
          fi
          echo "ai_provider=${ai_provider}" >> "$GITHUB_OUTPUT"
          echo "ai_base_url=${ai_base_url}" >> "$GITHUB_OUTPUT"
          echo "ai_model=${ai_model}" >> "$GITHUB_OUTPUT"
          echo "ai_api_key=${ai_api_key}" >> "$GITHUB_OUTPUT"
          echo "::notice::Provider ${ai_provider:-none} · ${ai_base_url:-unset} · model ${ai_model:-auto}"

      - name: Ask it something it cannot fake
        id: ask
        shell: bash
        continue-on-error: true
        env:
          AI_PROVIDER: ${{ steps.ai.outputs.ai_provider }}
          AI_BASE_URL: ${{ steps.ai.outputs.ai_base_url }}
          AI_MODEL: ${{ steps.ai.outputs.ai_model }}
          AI_API_KEY: ${{ steps.ai.outputs.ai_api_key }}
          DATA_DIR: ${{ github.workspace }}/.runtime/data
          LOG_DIR: ${{ github.workspace }}/.runtime/logs
        run: |
          set -uo pipefail
          # Straight to the file: nothing between the command and the record.
          python -m havoc ai "what is 2+2? answer with the number and nothing else" > .ai-probe.txt 2>&1
          status=$?
          reply=$(cat .ai-probe.txt)
          printf '%s\n' "$reply"
          echo "::notice::exit $status · ${#reply} bytes of output"
          # Written to the file as well as to the step output: the outputs of a
          # step with continue-on-error are not always delivered, and the file
          # is what the next steps read.
          printf '%s\n' "$status" > .ai-probe.status
          {
            echo "### AI probe"
            echo ""
            echo '```'
            printf '%s\n' "$reply"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            reason=$(printf '%s\n' "$reply" | grep -m1 -E "AI: (FAILED|not configured)|Fatal error" | cut -c1-300)
            reason="${reason//$'\n'/ }"
            echo "::error::The model did not answer (exit $status): ${reason:-no reason printed}"
            exit 0
          fi
          if printf '%s' "$reply" | grep -qi "AI: FAILED"; then
            echo "::error::The provider reported a failure."
          elif ! printf '%s' "$reply" | grep -q "4"; then
            echo "::warning::The reply did not contain 4 — it answered, but read it yourself."
          fi

      - name: What the gateway says to this runner
        # Only when the plain request failed: every generation call spends the
        # free tier's daily allowance (50), and a healthy probe must cost one.
        if: always()
        shell: bash
        env:
          AI_PROVIDER: ${{ steps.ai.outputs.ai_provider }}
          AI_BASE_URL: ${{ steps.ai.outputs.ai_base_url }}
          AI_MODEL: ${{ steps.ai.outputs.ai_model }}
          AI_API_KEY: ${{ steps.ai.outputs.ai_api_key }}
        run: |
          set -uo pipefail
          if grep -qi "AI: FAILED\|Fatal error" .ai-probe.txt 2>/dev/null; then
            python scripts/probe_ai.py > .ai-diag.txt 2>&1 || true
          else
            echo "healthy: no diagnostics needed"
            : > .ai-diag.txt
          fi
          cat .ai-diag.txt

      - name: Publish the answer where it can be read
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          python -c 'import json,os,pathlib,datetime;t=pathlib.Path(".ai-probe.txt");r=t.read_text(encoding="utf-8",errors="replace").strip() if t.exists() else "";f=[l.strip() for l in r.splitlines() if "AI: FAILED" in l or "Fatal error" in l];s=pathlib.Path(".ai-probe.status");c=int(s.read_text().strip()) if s.exists() and s.read_text().strip().isdigit() else 1;rec={"checked_at":datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),"exit_code":c,"ok":c==0 and not f and "Model:" in r,"failure":f[0] if f else "","answer":r};d=pathlib.Path(".ai-diag.txt");rec["diagnostics"]=d.read_text(encoding="utf-8",errors="replace").strip() if d.exists() else "";pathlib.Path(".ai-probe.json").write_text(json.dumps(rec,ensure_ascii=False,indent=2)+"\n",encoding="utf-8");print(rec["ok"])'
          rm -f .ai-probe.txt .ai-diag.txt .ai-probe.status
          git config user.name "HAVOC ai probe"
          git config user.email "probe@users.noreply.github.com"
          git add .ai-probe.json
          if git diff --cached --quiet; then
            echo "nothing new to publish"
            exit 0
          fi
          git commit -qm "ci: ai probe result [skip ci]"
          # The running bot commits snapshots every few minutes, so the branch
          # usually moves while this job runs. Rebase and retry; a lost publish
          # is a lost record of a real failure, which is the thing we need.
          for attempt in 1 2 3; do
            if git pull -q --rebase origin "${GITHUB_REF_NAME}" && \
               git push -q origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
              echo "published on attempt ${attempt}"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::warning::Could not publish the probe result; the artifact still has it."

      - name: Keep the record as an artifact too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-probe
          path: .ai-probe.json
          if-no-files-found: warn

      - name: Fail the job when the model did not answer
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          ok=$(python -c 'import json;print("yes" if json.load(open(".ai-probe.json")).get("ok") else "no")' 2>/dev/null || echo no)
          if [ "$ok" = "yes" ]; then
            exit 0
          fi
          # The free plan allows 50 model requests a day. Hitting that is a
          # quota fact, not a broken key, and must not paint the branch red —
          # but it is recorded, and it says so out loud.
          if grep -qi "rate_limited\|free-models-per-day" .ai-probe.json; then
            echo "::warning::Free-tier daily limit reached; the key is fine. The record says when."
            exit 0
          fi
          echo "::error::The AI probe did not get an answer; see .ai-probe.json."
          exit 1
