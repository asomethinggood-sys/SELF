name: Inspect synthetic SDXL comparisons

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sdxl-preview.yml
      - scripts/show_sdxl_thumbnails.py

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sdxl-quality-41822127223
          path: .reports/sdxl-quality
          run-id: 41822127223
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pip install -q Pillow
      - run: python scripts/show_sdxl_thumbnails.py
        env:
          SDXL_PREVIEW: single-baseline
      - run: python scripts/show_sdxl_thumbnails.py
        env:
          SDXL_PREVIEW: tiled-overlap-8
      - run: python scripts/show_sdxl_thumbnails.py
        env:
          SDXL_PREVIEW: tiled-overlap-16
      - run: python scripts/show_sdxl_thumbnails.py
        env:
          SDXL_PREVIEW: tiled-global-035
