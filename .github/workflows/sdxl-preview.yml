name: Inspect synthetic SDXL comparisons

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed synthetic cluster test run ID with quality artifact
        required: true
        type: string
  push:
    paths:
      - .github/workflows/sdxl-preview.yml
      - scripts/show_sdxl_thumbnails.py

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sdxl-quality-${{ inputs.run_id || '41840414228' }}
          path: .reports/sdxl-quality
          run-id: ${{ inputs.run_id || '41840414228' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pip install -q Pillow
      - run: python scripts/show_sdxl_thumbnails.py
        env:
          SDXL_PREVIEW: group-baseline
      - run: python scripts/show_sdxl_thumbnails.py
        env:
          SDXL_PREVIEW: group-cluster
      - run: python scripts/show_sdxl_thumbnails.py
        env:
          SDXL_PREVIEW: hand-baseline
      - run: python scripts/show_sdxl_thumbnails.py
        env:
          SDXL_PREVIEW: hand-cluster
      - run: python scripts/show_sdxl_thumbnails.py
        env:
          SDXL_PREVIEW: cat-baseline
      - run: python scripts/show_sdxl_thumbnails.py
        env:
          SDXL_PREVIEW: cat-cluster
