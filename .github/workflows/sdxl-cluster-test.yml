name: Experimental four-runner SDXL

# This isolated fixed-prompt experiment does not modify the live picture service.
# Four jobs collaborate on each denoising step; user prompts are never used here.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Experimental quality comparison to run
        type: choice
        default: wide-stress
        options:
          - wide-stress
          - crop-stress
          - wide-overlap
          - crop-conditioning
          - full-context-first
          - legacy
  push:
    paths:
      - .github/workflows/sdxl-cluster-test.yml
      - scripts/sdxl_cluster_test.py
      - scripts/sdxl_cluster/**
      - scripts/experimental_tiled_denoise.py

permissions:
  contents: write

concurrency:
  group: experimental-sdxl-cluster-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workers:
    name: SDXL cluster runner ${{ matrix.worker }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        worker: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore ComfyUI checkout if available
        uses: actions/cache/restore@v4
        with:
          path: .runtime/service-comfy/ComfyUI
          key: sdxl-cluster-restore-only-${{ github.run_id }}-${{ matrix.worker }}
          restore-keys: |
            comfy-
      - name: Prepare isolated worker
        shell: bash
        run: |
          set -euo pipefail
          export COMFY_DIR="$GITHUB_WORKSPACE/.runtime/service-comfy/ComfyUI"
          if [ ! -f "$COMFY_DIR/main.py" ]; then
            git clone --depth 1 --branch v0.43.2 https://github.com/comfyanonymous/ComfyUI.git "$COMFY_DIR"
          fi
          rm -f "$COMFY_DIR/models/checkpoints/"*.safetensors
          python -m pip install -q --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install -q --no-cache-dir -r "$COMFY_DIR/requirements.txt" filelock cryptography
          mkdir -p "$COMFY_DIR/models/checkpoints" "$COMFY_DIR/custom_nodes"
          dest="$COMFY_DIR/models/checkpoints/DreamShaperXL_Lightning.safetensors"
          curl -fsSL --retry 3 --connect-timeout 30 --max-time 900 -o "$dest" https://huggingface.co/Lykon/dreamshaper-xl-lightning/resolve/a33ea52a3da2dfaf6e9001940bdb04daae06e944/DreamShaperXL_Lightning.safetensors
          echo 'fdbe56354b8f876b736f24d3ad867ecd4140c019f57642ec8ddd878088d44f64  '"$dest" | sha256sum -c -
          ln -s "$GITHUB_WORKSPACE/scripts/sdxl_cluster" "$COMFY_DIR/custom_nodes/yura_sdxl_cluster"
          curl -fsSL --retry 3 --connect-timeout 30 -o "$RUNNER_TEMP/cloudflared" https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x "$RUNNER_TEMP/cloudflared"
      - name: Execute one synchronized distributed render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKER_INDEX: ${{ matrix.worker }}
          COMFY_DIR: ${{ github.workspace }}/.runtime/service-comfy/ComfyUI
          CLOUDFLARED: ${{ runner.temp }}/cloudflared
          PYTHONPATH: ${{ github.workspace }}
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          SDXL_TEST_RESOLUTION: '768'
          SDXL_TEST_SCENARIO: ${{ inputs.scenario || 'wide-stress' }}
        run: python -u scripts/sdxl_cluster_test.py
      - name: Preserve synthetic quality comparisons
        if: always() && matrix.worker == 0
        uses: actions/upload-artifact@v4
        with:
          name: sdxl-quality-${{ github.run_id }}
          path: .reports/sdxl-quality/*.png
          if-no-files-found: ignore
          retention-days: 7
