name: TikTok login (from a phone)

# The one step that needs a human, made available to a human with no terminal.
#
# `havoc tt login` opens a real Chromium and waits for a person to sign in. On a
# laptop that is a window. Here it is an Xvfb display, an x11vnc server and a
# noVNC page published through a Cloudflare quick tunnel — so the owner can open
# one https:// URL on an Android phone, tap through TikTok's own login page, and
# let the runner save the jar.
#
# Why not Termux: Playwright publishes no Chromium build for Android/arm64. The
# browser exists only on x86_64 Linux, so the browser has to live where a runner
# is — and the human has to reach it some other way than a window.
#
# What this does NOT do: type anything for you. The streamed page is TikTok's
# login page and the keystrokes are yours. Prefer QR / "continue with Google" if
# offered — a password typed into a streamed runner is a password on someone
# else's machine, even when that machine is ephemeral and yours.
#
# Security of the tunnel
# ----------------------
# A quick tunnel is a public URL. Three things bound the exposure: it exists only
# while this job runs (<= 30 minutes), it requires a VNC password that is
# generated per run and printed only into the job summary (visible to people who
# can already see the repository), and the runner is destroyed afterwards. Close
# the job as soon as the login lands.
#
# When it finishes
# ----------------
# The jar is committed to the branch automatically, so `tiktok.yml` can restore
# it. Nothing else to copy, no secret to paste.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long the login window stays open (default 25)"
        required: false
        default: "25"
  push:
    # Pushing this file is the request. Chosen because a token without the
    # `actions` permission cannot dispatch a workflow (403) while it can always
    # push, and this repository's automation token is exactly that kind: the
    # handover chain has to work by push or it does not work at all.
    # Nothing else in `.auth/tiktok/` triggers this, so the job's own commits
    # (the jar, the live link) cannot restart it.
    paths:
      - ".auth/tiktok/request-login"

permissions:
  contents: write

concurrency:
  group: havoc-tiktok-login
  cancel-in-progress: true

jobs:
  login:
    # A push only opens a window when it brought the request marker with it.
    if: github.event_name == 'workflow_dispatch' || hashFiles('.auth/tiktok/request-login') != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the browser side
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[browser]"
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify

      - name: Install cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared

      - name: Open the window and the stream
        id: stream
        run: |
          set -euo pipefail
          # A display with no monitor, which the owner can still see.
          Xvfb :99 -screen 0 1100x900x24 >/tmp/xvfb.log 2>&1 &
          sleep 2
          export DISPLAY=:99

          VNC_PASS="$(python -c 'import secrets; print(secrets.token_urlsafe(9))')"
          echo "::add-mask::$VNC_PASS"
          x11vnc -storepasswd "$VNC_PASS" /tmp/vncpass >/dev/null 2>&1
          x11vnc -display :99 -rfbauth /tmp/vncpass -forever -shared -noxdamage \
            >/tmp/x11vnc.log 2>&1 &
          sleep 2

          websockify --web=/usr/share/novnc 6080 localhost:5900 >/tmp/websockify.log 2>&1 &
          sleep 2

          /tmp/cloudflared tunnel --url http://localhost:6080 --no-autoupdate \
            >/tmp/cloudflared.log 2>&1 &
          for _ in $(seq 1 40); do
            URL="$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)"
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "${URL:-}" ]; then
            echo "::error::the tunnel did not come up"; tail -30 /tmp/cloudflared.log; exit 1
          fi

          LINK="${URL}/vnc.html?autoconnect=1&resize=scale&reconnect=1"
          echo "link=$LINK" >> "$GITHUB_OUTPUT"
          echo "vnc_pass=$VNC_PASS" >> "$GITHUB_OUTPUT"
          {
            echo "## TikTok login window"
            echo ""
            echo "1. Open this on your phone: **[${URL}/vnc.html](${LINK})**"
            echo "2. Password: \`${VNC_PASS}\`"
            echo "3. Sign in to TikTok normally. The page may look small — pinch to zoom."
            echo "4. When you are in, nothing else is needed: this job saves the session and stops."
            echo ""
            echo "The link dies when this job ends. Close it yourself once you are signed in."
          } >> "$GITHUB_STEP_SUMMARY"

          # Also into the repository, because the Actions summary is only visible
          # to whoever is logged into the web UI — and the point of this route is
          # that the owner is on a phone with no terminal and the agent is often
          # the one reading the run. Removed again the moment the job ends.
          python - "$LINK" "$VNC_PASS" <<'PY2'
          import json, sys, time
          link, password = sys.argv[1], sys.argv[2]
          open(".auth/tiktok/live.json", "w").write(json.dumps({
              "link": link,
              "password": password,
              "expires_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(time.time() + 1800)),
              "note": "delete me when the job ends",
          }, indent=2))
          PY2
          git config user.name "yura-tiktok"
          git config user.email "yura-tiktok@users.noreply.github.com"
          git add .auth/tiktok/live.json
          git commit -q -m "tiktok: login window open [skip ci]" || true
          git push -q || echo "::warning::could not publish the live link"

      - name: Wait for the owner to sign in
        env:
          DISPLAY: ":99"
          HAVOC_TIKTOK_DIR: .auth/tiktok
        run: |
          set +e
          timeout "$(( ${{ inputs.minutes || 25 }} * 60 ))" \
            havoc tt login --timeout 1500 2>&1 | tee /tmp/login.log
          code=${PIPESTATUS[0]}
          echo "login-exit=${code}" >> "$GITHUB_ENV"

      - name: Commit the jar, close the window
        if: always()
        run: |
          git config user.name "yura-tiktok"
          git config user.email "yura-tiktok@users.noreply.github.com"
          saved=no
          if [ -f .auth/tiktok/default.json ]; then
            if python scripts/tiktok_check_jar.py; then saved=yes; fi
          else
            echo "::warning::No jar was written — the sign-in did not complete before the timeout."
          fi
          # The link and the request marker are single-use: leaving them behind
          # would mean a stale password in the repository and a workflow that
          # reopens a window on every later push.
          rm -f .auth/tiktok/live.json .auth/tiktok/request-login
          git add -A .auth/tiktok
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            if [ "$saved" = "yes" ]; then
              git commit -q -m "tiktok: session from the login window [skip ci]"
            else
              git commit -q -m "tiktok: login window closed without a session [skip ci]"
            fi
            git push -q || echo "::warning::could not push"
          fi
          echo "::notice::saved=$saved"

      - name: What to do next
        if: always()
        run: |
          {
            echo "### Next"
            echo ""
            if [ -f .auth/tiktok/default.json ]; then
              echo "The session is committed. Open **Actions → TikTok run → Run workflow** and leave it alone."
            else
              echo "No session was saved. Dispatch this workflow again and complete the sign-in within the window."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
