name: Dispatch probe

# One question, answered by GitHub rather than by guessing: can a workflow start
# another workflow with the repository's own GITHUB_TOKEN? GitHub's documentation
# makes an exception for `workflow_dispatch`, but a 24/7 chain depends on it, so
# this asks the API and publishes the answer.
#
# If the answer is yes, the bot can hand over to its own successor and there is
# no gap between runs. If it is no, the design has to change — and this log says
# so before anyone builds on it.

on:
  push:
    paths:
      - ".github/workflows/dispatch-probe.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Try to dispatch the bot workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          echo "token length: ${#GH_TOKEN}"
          code=$(curl -sS -o dispatch.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${REPO}/actions/workflows/auth-and-run.yml/dispatches" \
            -d "{\"ref\":\"${REF}\"}")
          echo "HTTP ${code}"
          cat dispatch.json || true
          echo "http_code=${code}" >> "$GITHUB_OUTPUT"
          {
            echo "### workflow_dispatch with GITHUB_TOKEN"
            echo ""
            echo "HTTP \`${code}\` on ref \`${REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Did a run appear?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          sleep 20
          curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
            "${GITHUB_API_URL}/repos/${REPO}/actions/runs?per_page=10" \
            | python -c "import json,sys;d=json.load(sys.stdin);[print(r['id'], r['name'], r['event'], r['status'], r['head_branch']) for r in d.get('workflow_runs',[])]"
