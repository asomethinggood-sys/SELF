name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,media]"

      - name: Locale coverage
        run: python scripts/check_locales.py

      - name: Documentation is generated
        run: python scripts/generate_docs.py --check

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest.log

      - name: Report failures
        # The job log archive is not always reachable; annotations are. This
        # turns a red run into something you can read from the API.
        if: failure()
        shell: bash
        run: |
          if [ ! -f pytest.log ]; then
            echo "::error::pytest produced no log"
            exit 0
          fi
          grep -E '^(FAILED|ERROR) |^E ' pytest.log | head -10 | while IFS= read -r line; do
            echo "::error::${line//$'\n'/ }"
          done

      - name: CLI smoke test
        run: |
          python -m havoc version
          python -m havoc check || true

  lint:
    name: syntax and import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,media]"
      - name: Lint
        run: python -m ruff check .
      - name: Compile every module
        run: python -m compileall -q havoc scripts
      - name: Import every module
        run: python -c "import havoc.features, havoc.scheduler, havoc.runtime, havoc.main; print('imports ok')"
