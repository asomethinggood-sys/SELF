name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  piped-alternative-probe:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[alternative-engines]')
    name: Live public Piped YouTube alternative
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install media inspector
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Download and validate public video
        run: python3 scripts/probe_piped.py

  cobalt-alternative-probe:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[alternative-engines]')
    name: Live Cobalt YouTube alternative
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install media inspector
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Run Cobalt on loopback and download a public video
        shell: bash
        run: |
          set -euo pipefail
          docker network create yura-media >/dev/null
          trap 'docker stop yura-cobalt yura-youtube-session 2>/dev/null || true; docker network rm yura-media 2>/dev/null || true' EXIT
          docker run -d --rm --name yura-youtube-session --network yura-media \
            -p 127.0.0.1:8080:8080 ghcr.io/imputnet/yt-session-generator:webserver
          for n in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/token >/dev/null; then break; fi
            sleep 2
          done
          if ! curl -fsS http://127.0.0.1:8080/token >/dev/null; then
            echo '::error::YouTube session generator did not become ready'
            exit 1
          fi
          docker run -d --rm --name yura-cobalt --network yura-media -p 127.0.0.1:9000:9000 \
            -e API_URL=http://127.0.0.1:9000/ \
            -e YOUTUBE_SESSION_SERVER=http://yura-youtube-session:8080/ ghcr.io/imputnet/cobalt:latest
          for n in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/ >/dev/null; then break; fi
            sleep 2
          done
          python3 scripts/probe_alternative_media.py cobalt

  spotify-alternative-probe:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[alternative-engines]')
    name: Live Spotify matching alternatives
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install candidate and media inspector
        run: |
          python -m pip install --upgrade spotdl
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Try SoundCloud and Bandcamp matches
        run: python scripts/probe_alternative_media.py spotify

  media-engine-probe:
    # Deliberately opt-in: this downloads public media and contacts third parties.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[media-engines]')
    name: Live media engine comparison
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install candidate engines
        run: |
          python -m pip install --upgrade -e ".[download]" yt-dlp-ejs bgutil-ytdlp-pot-provider spotdl
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          git clone -q --depth 1 --branch 2.0.2 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git "$RUNNER_TEMP/pot-provider"
          cd "$RUNNER_TEMP/pot-provider/server"
          npm ci --silent
          npx tsc
      - name: Try real public links without Telegram
        run: |
          node "$RUNNER_TEMP/pot-provider/server/build/main.js" > "$RUNNER_TEMP/pot.log" 2>&1 &
          provider=$!
          trap 'kill "$provider" 2>/dev/null || true' EXIT
          sleep 5
          if ! kill -0 "$provider" 2>/dev/null; then
            echo '::error::The token provider failed to start'
            tail -n 30 "$RUNNER_TEMP/pot.log"
            exit 1
          fi
          python scripts/probe_media_engines.py

  youtube-live-probe:
    # Opt in with the push commit message; never fetch media on routine CI runs.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[youtube-probe]')
    name: Live YouTube download probe
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install downloader and media tools
        run: |
          python -m pip install -e ".[download]"
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Download and inspect a public video (no Telegram)
        run: python scripts/probe_youtube_live.py

  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,media,voice]"

      - name: Locale coverage
        run: python scripts/check_locales.py

      - name: Documentation is generated
        run: python scripts/generate_docs.py --check

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest.log

      - name: Report failures
        # The job log archive is not always reachable; annotations are. This
        # turns a red run into something you can read from the API.
        if: failure()
        shell: bash
        run: |
          if [ ! -f pytest.log ]; then
            echo "::error::pytest produced no log"
            exit 0
          fi
          grep -E '^(FAILED|ERROR) |^E ' pytest.log | head -10 | while IFS= read -r line; do
            echo "::error::${line//$'\n'/ }"
          done

      # Every registered command, dispatched for real with a battery of arguments,
      # plus locale coverage, feature switches, tool schemas and dead code. Static
      # checks cannot see a command that answers with its own key or a reply that
      # never arrives; this can.
      - name: Walk the whole project
        run: python scripts/audit_live.py --json .audit.json
        if: matrix.python-version == '3.11'

      # The renderer probe: every reply judged as the *chat* would see it —
      # balanced and allowed HTML, no escaped entity leaking, no markdown
      # leftovers, no empty answer, no locale placeholder, plus a write-then-read
      # round trip for every command that stores something. This is the check that
      # catches "it answered" and "it answered with `&amp;lt;b&amp;gt;Sara`".
      - name: Every message is well formed
        run: python scripts/probe_everything.py --json .probe.json --lang both
        if: matrix.python-version == '3.11'

      - name: CLI smoke test
        run: |
          python -m havoc version
          python -m havoc check || true

  lint:
    name: syntax and import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,media,voice]"
      - name: Lint
        run: python -m ruff check .
      - name: Compile every module
        run: python -m compileall -q havoc scripts
      - name: Import every module
        run: python -c "import havoc.features, havoc.scheduler, havoc.runtime, havoc.main; print('imports ok')"
